# Render Blueprint — 홀덤 서버 (클라이언트까지 같이 서빙)
#
# 무료 플랜은 15분간 인바운드 트래픽이 없으면 잠들고, 깨는 데 약 1분 걸린다.
# 다만 Socket.io가 25초마다 핑을 주고받으므로 게임 중에는 잠들지 않는다.
# (Render 문서: HTTP 요청과 기존 연결의 WebSocket 메시지 모두 슬립을 막는다)
#
# 무료 플랜은 인스턴스가 1개로 고정이라, 이 앱이 요구하는 "서버 1대" 조건과 맞는다.

services:
  - type: web
    name: holdem
    runtime: docker
    plan: free
    region: singapore          # Render 리전 중 한국에서 가장 가까움
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
