# fly.toml — 홀덤 서버 (클라이언트까지 같이 서빙)
#
# 중요: 이 앱은 방·칩·블라인드 시계를 전부 프로세스 메모리에 들고 있다.
# 머신이 멈추거나 2대 이상으로 늘어나면 진행 중인 게임이 깨진다.
# 그래서 auto_stop_machines를 끄고 항상 1대를 띄워 둔다.

app = "holdem"
primary_region = "nrt"          # 도쿄 — 한국에서 가장 가까운 리전

[build]

[env]
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  # 절대 "stop"/"suspend"로 두지 말 것 — 잠깐 자리를 비우면 판이 날아간다
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
